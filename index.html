<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking QR Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">⚔️ Viking QR Forge ⚔️</h1>
            <p class="subtitle">Genera QR code funzionanti con stile nordico</p>
        </header>

        <main class="main-content">
            <!-- Card Impostazioni -->
            <div class="card settings-card">
                <div class="card-header">
                    <h2>⚙️ Impostazioni</h2>
                </div>
                
                <div class="section">
                    <label class="label">Testo/URL</label>
                    <textarea id="qr-text" placeholder="https://esempio.com" rows="3">https://esempio.com</textarea>
                </div>

                <div class="section">
                    <h3 class="section-title">Stile</h3>
                    <div class="presets-grid">
                        <button class="preset-btn active" data-preset="classic">
                            <div class="preset-preview" style="background: #000000;"></div>
                            <span>Classico</span>
                        </button>
                        <button class="preset-btn" data-preset="viking">
                            <div class="preset-preview" style="background: #8B4513;"></div>
                            <span>Legno & Osso</span>
                        </button>
                        <button class="preset-btn" data-preset="ice">
                            <div class="preset-preview" style="background: #4682B4;"></div>
                            <span>Ghiaccio</span>
                        </button>
                        <button class="preset-btn" data-preset="runes">
                            <div class="preset-preview" style="background: #CD853F;"></div>
                            <span>Rune Dorate</span>
                        </button>
                    </div>
                </div>

                <div class="section">
                    <div class="controls-grid">
                        <div class="control-group">
                            <label class="label">
                                Dimensione: <span id="size-value">256</span>px
                            </label>
                            <input type="range" id="size" min="200" max="500" value="256" step="32">
                        </div>
                        
                        <div class="control-group">
                            <label class="label">Correzione Errore</label>
                            <select id="error-correction">
                                <option value="L">Basso (7%)</option>
                                <option value="M" selected>Medio (15%)</option>
                                <option value="Q">Alto (25%)</option>
                                <option value="H">Massimo (30%)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="controls-grid">
                        <div class="control-group">
                            <label class="label">Colore Moduli</label>
                            <input type="color" id="foreground-color" value="#000000">
                        </div>
                        
                        <div class="control-group">
                            <label class="label">Colore Sfondo</label>
                            <input type="color" id="background-color" value="#FFFFFF">
                        </div>
                    </div>
                </div>

                <div class="section">
                    <button id="reset-btn" class="btn-secondary">🔄 Reimposta</button>
                </div>
            </div>

            <!-- Card Anteprima -->
            <div class="card preview-card">
                <div class="card-header">
                    <h2>👁️ Anteprima</h2>
                </div>
                
                <div class="qr-preview">
                    <canvas id="qr-canvas" width="256" height="256"></canvas>
                </div>

                <div class="scan-status" id="scan-status">
                    <div class="status-icon">✅</div>
                    <div class="status-text">QR Code generato</div>
                </div>

                <div class="button-group">
                    <button id="download-png" class="btn-primary">📱 Scarica PNG</button>
                    <button id="download-svg" class="btn-primary">🎨 Scarica SVG</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>🔨 Forgiato con passione vichinga</p>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
