<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <!-- Pattern Runico Base -->
    <pattern id="runic-pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      
      <!-- Intrecci Celtici -->
      <g stroke="#4682B4" stroke-width="1.5" fill="none" opacity="0.3">
        <!-- Linee intrecciate verticali -->
        <path d="M10 0 Q20 15 10 30 Q20 45 10 60"/>
        <path d="M30 0 Q40 15 30 30 Q40 45 30 60"/>
        <path d="M50 0 Q40 15 50 30 Q40 45 50 60"/>
        
        <!-- Linee intrecciate orizzontali -->
        <path d="M0 10 Q15 20 30 10 Q45 20 60 10"/>
        <path d="M0 30 Q15 40 30 30 Q45 40 60 30"/>
        <path d="M0 50 Q15 40 30 50 Q45 40 60 50"/>
      </g>
      
      <!-- Rune stilizzate -->
      <g stroke="#CD853F" stroke-width="2" fill="none" opacity="0.2">
        <!-- Runa Algiz (protezione) -->
        <path d="M15 40 L15 50 M10 45 L15 40 L20 45"/>
        
        <!-- Runa Fehu (ricchezza) -->
        <path d="M45 10 L45 20 L50 15 M45 15 L48 18"/>
        
        <!-- Punti decorativi -->
        <circle cx="25" cy="25" r="1" fill="#FFD700" opacity="0.4"/>
        <circle cx="35" cy="35" r="1" fill="#FFD700" opacity="0.4"/>
      </g>
    </pattern>
    
    <!-- Pattern Scudo -->
    <pattern id="shield-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <g stroke="#8B4513" stroke-width="1" fill="none" opacity="0.15">
        <circle cx="20" cy="20" r="15"/>
        <path d="M5 20 L35 20 M20 5 L20 35"/>
        <path d="M8 8 L32 32 M32 8 L8 32"/>
      </g>
    </pattern>
    
    <!-- Pattern Tempesta -->
    <pattern id="storm-pattern" x="0" y="0" width="50" height="30" patternUnits="userSpaceOnUse">
      <rect width="50" height="30" fill="none"/>
      <g stroke="#2F4F4F" stroke-width="1" fill="none" opacity="0.1">
        <path d="M0 15 Q12.5 5 25 15 T50 15"/>
        <path d="M0 10 Q12.5 0 25 10 T50 10"/>
        <path d="M0 20 Q12.5 10 25 20 T50 20"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Pattern principale (combinazione) -->
  <rect width="60" height="60" fill="url(#runic-pattern)"/>
</svg>